name: CI
on:
  push:
  pull_request:
jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        continue-on-error: true
      - run: bun run lint
        continue-on-error: true
