[project]
name = "aegisflow-backend"
version = "1.0.0"
description = "AegisFlow workflow diagnostics and controlled recovery API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0", "pydantic-settings>=2.4,<3.0",
  "google-genai>=1.0.0", "httpx>=0.27,<1.0"
]
[tool.pytest.ini_options]
testpaths = ["tests"]
